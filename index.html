<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enter Call ID and REQ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Enter Information</h1>
    <form id="login">
      <p>Enter Call ID:</p>
      <input id="secret" type="password" name="secret" required>
      <p>Enter REQ:</p>
      <input id="phone" type="tel" name="phone">
      <p>Associate</p>
      <input type="submit" class="btn" value="Run">
    </form>
    <div class="alert">Waiting for inputs</div>
  </div>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
